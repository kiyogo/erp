[package]
name = "kiyo-admin-desktop"
version = "0.1.0"
description = "KIYOVN Enterprise Native Rust Desktop Application"
edition = "2024"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "persistence"] }
egui = "0.29"
egui_extras = { version = "0.29", features = ["all_loaders"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "blocking", "multipart"] }
chrono = { version = "0.4", features = ["serde"] }
rfd = "0.15"
windows-sys = { version = "0.61", features = ["Win32_UI_HiDpi"] }
