<!DOCTYPE html>
<html lang="vi" class="app-booting">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KIYOVN - Quản trị Doanh nghiệp</title>
    <style>
      html, body { margin: 0; background: #fdfdfd; }
      html.app-booting #root { visibility: hidden; }
    </style>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('kiyovn_theme') || 'light';
          var isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.add(isDark ? 'theme-dark' : 'theme-light');
          if (isDark) document.documentElement.style.background = '#0B0F19';
        } catch (_) {
          document.documentElement.classList.add('theme-light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
