services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PGDATABASE:-appdnt}
      POSTGRES_USER: ${PGUSER:-postgres}
      POSTGRES_PASSWORD: ${PGPASSWORD:-postgres123}
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data

  backend:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      HOST: 0.0.0.0
      DATABASE_URL: postgres://${PGUSER:-postgres}:${PGPASSWORD:-postgres123}@postgres:5432/${PGDATABASE:-appdnt}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env before starting production}
    depends_on:
      - postgres
    volumes:
      - kiyovn-data:/data

  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pg-data:
  kiyovn-data:
