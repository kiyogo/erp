[package]
name = "kiyo-ui"
version = "0.1.0"
description = "Shared KIYO Rust UI, state and API client for native and WebAssembly targets"
edition = "2024"

[lib]
path = "src/lib.rs"

[features]
default = []
visual-test = []

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "persistence"] }
egui = "0.29"
egui_extras = { version = "0.29", features = ["all_loaders"] }
image = { version = "0.25", default-features = false, features = ["png"] }
ehttp = "0.5"
mime_guess = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
web-time = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = "0.15"

[target.'cfg(target_arch = "wasm32")'.dependencies]
rfd = { version = "0.15", default-features = false, features = ["async-std", "file-handle-inner", "xdg-portal"] }
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Storage", "Window"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_HiDpi"] }

