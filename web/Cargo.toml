[package]
name = "kiyo-web-wasm"
version = "0.1.0"
description = "KIYOVN WebAssembly launcher for the shared kiyo-ui crate"
edition = "2024"

[features]
default = []
visual-test = ["kiyo-ui/visual-test"]

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
kiyo-ui = { path = "../ui" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "Document", "Window", "Element", "HtmlElement", "History", "Location", "UrlSearchParams"] }

